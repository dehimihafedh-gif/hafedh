<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حافظ</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/calendar--v1.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="pb-28">

  <!-- الترويسة العلوية الحديثة -->
  <header class="bg-white shadow-sm p-3 sticky top-0 z-40 flex items-center justify-between border-b">
    <div class="flex items-center gap-2">
      <button onclick="openModal('backupModal')" class="bg-red-50 hover:bg-red-100 p-2 rounded-xl text-red-600 text-sm shadow-sm border border-red-100" title="نسخ احتياطي">💾</button>
      <button onclick="openModal('savedModal')" class="bg-amber-50 hover:bg-amber-100 p-2 rounded-xl text-amber-600 text-sm shadow-sm border border-amber-100" title="المحفوظات">🌶️</button>
      <button onclick="openModal('incomeModal')" class="bg-emerald-50 hover:bg-emerald-100 p-2 rounded-xl text-emerald-600 text-sm shadow-sm border border-emerald-100" title="الدخل">💰</button>
      <button onclick="openModal('prayerModal')" class="bg-sky-50 hover:bg-sky-100 p-2 rounded-xl text-sky-600 text-sm shadow-sm border border-sky-100" title="الصلاة">🕌</button>
    </div>
    <div class="flex items-center gap-1.5">
      <h1 class="text-xl font-black text-amber-700 tracking-wider flex items-center gap-1">
        <span>🧠⚡</span> حافظ
      </h1>
    </div>
  </header>

  <!-- شريط الفلترة والترتيب (نافذة منبثقة للترتيب) -->
  <div class="max-w-md mx-auto px-4 mt-3 flex justify-between items-center">
    <span id="archive-link" onclick="openModal('archiveModal')" class="text-xs text-gray-500 cursor-pointer bg-white px-3 py-1.5 rounded-xl shadow-sm border">📁 الأرشيف (0)</span>
    <button onclick="openModal('sortModal')" id="current-sort-btn" class="bg-white border text-xs px-3 py-1.5 rounded-xl shadow-sm text-gray-700 font-bold flex items-center gap-1">
      ⚙️ <span id="sort-label-text">يدوي</span>
    </button>
  </div>

  <!-- قائمة المهام الرئيسية -->
  <main class="p-4 max-w-md mx-auto space-y-3" id="items-container">
    <!-- تُعبأ ديناميكياً -->
  </main>

  <!-- زر الإضافة العائم -->
  <div class="fixed bottom-4 left-0 right-0 flex justify-center z-30 pointer-events-none">
    <button onclick="openModal('addModal')" class="pointer-events-auto bg-amber-600 hover:bg-amber-700 text-white font-bold px-8 py-3 rounded-full shadow-lg text-base flex items-center gap-2 transition-transform active:scale-95">
      <span>+ مهمة</span>
    </button>
  </div>

  <!-- ================= نافذة اختيار الترتيب ================= -->
  <div id="sortModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800 text-lg">اختر طريقة الترتيب</h3>
        <button onclick="closeModal('sortModal')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>
      <div class="space-y-2">
        <button onclick="setSortMode('manual', 'يدوي')" class="w-full text-right p-3 rounded-xl border hover:bg-amber-50 font-semibold text-sm flex items-center justify-between"><span>⚙️ ترتيب يدوي</span></button>
        <button onclick="setSortMode('time', 'الوقت')" class="w-full text-right p-3 rounded-xl border hover:bg-amber-50 font-semibold text-sm flex items-center justify-between"><span>⏰ حسب التوقيت</span></button>
        <button onclick="setSortMode('prio', 'الأولوية')" class="w-full text-right p-3 rounded-xl border hover:bg-amber-50 font-semibold text-sm flex items-center justify-between"><span>⭐ حسب الأولوية</span></button>
      </div>
    </div>
  </div>

  <!-- ================= نافذة إضافة مهمة ================= -->
  <div id="addModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800 text-lg">إضافة مهمة جديدة</h3>
        <button onclick="closeModal('addModal')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">العنوان / الاسم</label>
        <input type="text" id="inp-name" placeholder="أدخل العنوان أو الاسم" class="w-full p-3 border rounded-xl bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">رقم الهاتف</label>
        <div class="flex gap-2">
          <input type="tel" id="inp-phone" placeholder="05XXXXXXXX" class="w-full p-3 border rounded-xl bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
          <button type="button" onclick="pickContact()" class="bg-gray-100 hover:bg-gray-200 px-3 rounded-xl border text-xs" title="من السجل">📇</button>
        </div>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">المبلغ / المدخول (اختياري)</label>
        <input type="number" id="inp-amount" value="0" class="w-full p-3 border rounded-xl bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">الأولوية</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="setPriority('low')" id="prioLow" class="py-2 rounded-xl border text-sm font-semibold text-green-700 bg-green-50 border-green-200">منخفضة</button>
          <button type="button" onclick="setPriority('med')" id="prioMed" class="py-2 rounded-xl border text-sm font-semibold text-white bg-amber-600">متوسطة</button>
          <button type="button" onclick="setPriority('high')" id="prioHigh" class="py-2 rounded-xl border text-sm font-semibold text-red-700 bg-red-50 border-red-200">عالية</button>
        </div>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">تاريخ ووقت</label>
        <input type="datetime-local" id="inp-date" class="w-full p-3 border rounded-xl bg-gray-50 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">ملاحظات</label>
        <textarea id="inp-notes" placeholder="تفاصيل إضافية..." class="w-full p-3 border rounded-xl bg-gray-50 text-sm h-20 focus:outline-none"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="closeModal('addModal')" class="bg-gray-100 text-gray-600 py-3 rounded-xl font-bold">إلغاء</button>
        <button onclick="saveNewItem()" class="bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl font-bold shadow-md">حفظ</button>
      </div>
    </div>
  </div>

  <!-- ================= نافذة المحفوظات ================= -->
  <div id="savedModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-amber-600 text-lg">المحفوظات 🌶️</h3>
        <button onclick="closeModal('savedModal')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>
      <div class="space-y-3" id="saved-items-container"></div>
      <button onclick="closeModal('savedModal')" class="w-full bg-gray-100 text-gray-700 py-2.5 rounded-xl font-bold">إغلاق</button>
    </div>
  </div>

  <!-- ================= نافذة الأرشيف ================= -->
  <div id="archiveModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-700 text-lg">الأرشيف (المنجزة) 📁</h3>
        <button onclick="closeModal('archiveModal')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>
      <div class="space-y-3" id="archive-items-container"></div>
      <button onclick="closeModal('archiveModal')" class="w-full bg-gray-100 text-gray-700 py-2.5 rounded-xl font-bold">إغلاق</button>
    </div>
  </div>

  <!-- ================= نافذة الدخل والمصاريف ================= -->
  <div id="incomeModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-emerald-700 text-lg">الدخل والمصاريف 💰</h3>
        <button onclick="closeModal('incomeModal')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>
      <div class="bg-emerald-50 p-4 rounded-2xl text-center space-y-1">
        <span class="text-xs text-gray-500 block">صافي الشهر</span>
        <span id="net-balance" class="text-2xl font-black text-emerald-600">0</span> دج
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white border p-3 rounded-xl text-center shadow-sm">
          <span class="text-xs text-gray-400 block">المصاريف</span>
          <span id="total-expenses" class="font-bold text-red-500 text-lg">0</span>
        </div>
        <div class="bg-white border p-3 rounded-xl text-center shadow-sm">
          <span class="text-xs text-gray-400 block">المداخيل</span>
          <span id="total-incomes" class="font-bold text-emerald-600 text-lg">0</span>
        </div>
      </div>
      <div class="border-t pt-3 space-y-2">
        <h4 class="font-bold text-xs text-gray-600">إضافة حركة مالية سريعة</h4>
        <input type="text" id="fin-desc" placeholder="البيان (مثال: كراء، دواء...)" class="w-full p-2.5 border rounded-xl text-xs">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="fin-amount" placeholder="المبلغ" class="w-full p-2.5 border rounded-xl text-xs">
          <select id="fin-type" class="w-full p-2.5 border rounded-xl text-xs bg-white">
            <option value="income">دخل (+)</option>
            <option value="expense">مصروف (-)</option>
          </select>
        </div>
        <button onclick="addFinancialRecord()" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs">إضافة الحركة المالية</button>
      </div>
      <button onclick="closeModal('incomeModal')" class="w-full bg-gray-100 text-gray-700 py-2.5 rounded-xl font-bold">إغلاق</button>
    </div>
  </div>

  <!-- ================= نافذة الصلاة ================= -->
  <div id="prayerModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sky-700 text-lg">إحصائيات وتقويم الصلاة 🕌</h3>
        <button onclick="closeModal('prayerModal')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-gray-50 p-3 rounded-xl border">
          <span id="pr-on-time" class="text-lg font-bold text-green-600">0</span>
          <span class="block text-[10px] text-gray-400">🟢 في وقتها</span>
        </div>
        <div class="bg-gray-50 p-3 rounded-xl border">
          <span id="pr-delayed" class="text-lg font-bold text-gray-500">0</span>
          <span class="block text-[10px] text-gray-400">⚪ تأخرت</span>
        </div>
        <div class="bg-gray-50 p-3 rounded-xl border">
          <span id="pr-severe" class="text-lg font-bold text-red-500">0</span>
          <span class="block text-[10px] text-gray-400">🔴 تأخر شديد</span>
        </div>
      </div>
      <div class="space-y-2 border-t pt-3">
        <h4 class="font-bold text-xs text-gray-600">تسجيل صلاة اليوم</h4>
        <div class="grid grid-cols-5 gap-1 text-center">
          <button onclick="logPrayer('الفجر')" class="p-2 border rounded-lg text-xs bg-sky-50 font-bold">الفجر</button>
          <button onclick="logPrayer('الظهر')" class="p-2 border rounded-lg text-xs bg-sky-50 font-bold">الظهر</button>
          <button onclick="logPrayer('العصر')" class="p-2 border rounded-lg text-xs bg-sky-50 font-bold">العصر</button>
          <button onclick="logPrayer('المغرب')" class="p-2 border rounded-lg text-xs bg-sky-50 font-bold">المغرب</button>
          <button onclick="logPrayer('العشاء')" class="p-2 border rounded-lg text-xs bg-sky-50 font-bold">العشاء</button>
        </div>
      </div>
      <button onclick="closeModal('prayerModal')" class="w-full bg-gray-100 text-gray-700 py-2.5 rounded-xl font-bold">إغلاق</button>
    </div>
  </div>

  <!-- ================= نافذة النسخ الاحتياطي ================= -->
  <div id="backupModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800 text-lg">النسخ الاحتياطي 💾</h3>
        <button onclick="closeModal('backupModal')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>
      <div class="space-y-3">
        <button onclick="localBackup()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl font-bold shadow-sm">📥 حفظ محلي (ملف JSON)</button>
        <button onclick="driveBackup()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold shadow-sm">☁️ مزامنة عبر Google Drive</button>
        <label class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-700 text-center py-3 rounded-xl font-bold cursor-pointer">
          📤 استرجاع / رفع ملف
          <input type="file" onchange="restoreLocal(event)" class="hidden">
        </label>
      </div>
    </div>
  </div>

  <script>
    let currentPriority = 'med';
    let currentSortMode = 'manual';
    let items = JSON.parse(localStorage.getItem('hafedh_items')) || [
      { id: 1, name: 'كراء الشرقية', phone: '', amount: '1000', priority: 'low', date: '', notes: '', status: 'active' },
      { id: 2, name: 'كارت الشفاء عائلية', phone: '', amount: '0', priority: 'high', date: '', notes: '', status: 'active' },
      { id: 3, name: 'بلقاسم غيوط', phone: '213675933981', amount: '0', priority: 'med', date: '', notes: '', status: 'active' }
    ];
    let archive = JSON.parse(localStorage.getItem('hafedh_archive')) || [];
    let saved = JSON.parse(localStorage.getItem('hafedh_saved')) || [];
    let finances = JSON.parse(localStorage.getItem('hafedh_finances')) || [];
    let prayers = JSON.parse(localStorage.getItem('hafedh_prayers')) || [];

    function openModal(id) { 
      document.getElementById(id).classList.remove('hidden'); 
      renderAllSubViews(); 
    }
    
    function closeModal(id) { 
      document.getElementById(id).classList.add('hidden'); 
    }

    function setPriority(prio) {
      currentPriority = prio;
      ['Low', 'Med', 'High'].forEach(p => {
        document.getElementById('prio' + p).className = "py-2 rounded-xl border text-sm font-semibold bg-white text-gray-600";
      });
      if(prio === 'low') document.getElementById('prioLow').className = "py-2 rounded-xl border text-sm font-semibold text-green-700 bg-green-50 border-green-200";
      if(prio === 'med') document.getElementById('prioMed').className = "py-2 rounded-xl border text-sm font-semibold text-white bg-amber-600";
      if(prio === 'high') document.getElementById('prioHigh').className = "py-2 rounded-xl border text-sm font-semibold text-red-700 bg-red-50 border-red-200";
    }

    async function pickContact() {
      if ('contacts' in navigator && 'select' in navigator.contacts) {
        try {
          const props = ['name', 'tel'];
          const opts = { multiple: false };
          const c = await navigator.contacts.select(props, opts);
          if (c.length) {
            if(c[0].tel) document.getElementById('inp-phone').value = c[0].tel[0];
            if(c[0].name && !document.getElementById('inp-name').value) document.getElementById('inp-name').value = c[0].name[0];
          }
        } catch (ex) { alert('تعذر الوصول لجهات الاتصال'); }
      } else {
        alert('خاصية اختيار جهات الاتصال غير مدعومة في هذا المتصفح، يمكنك إدخال الرقم يدوياً.');
      }
    }

    function saveNewItem() {
      const name = document.getElementById('inp-name').value;
      const phone = document.getElementById('inp-phone').value;
      const amount = document.getElementById('inp-amount').value;
      const date = document.getElementById('inp-date').value;
      const notes = document.getElementById('inp-notes').value;

      if(name) {
        items.unshift({ id: Date.now(), name, phone, amount, priority: currentPriority, date, notes, status: 'active' });
        saveAndRender();
        closeModal('addModal');
        document.getElementById('inp-name').value = '';
        document.getElementById('inp-phone').value = '';
        document.getElementById('inp-amount').value = '0';
        document.getElementById('inp-notes').value = '';
        document.getElementById('inp-date').value = '';
      } else {
        alert('الرجاء إدخال اسم المهمة');
      }
    }

    function saveAndRender() {
      localStorage.setItem('hafedh_items', JSON.stringify(items));
      localStorage.setItem('hafedh_archive', JSON.stringify(archive));
      localStorage.setItem('hafedh_saved', JSON.stringify(saved));
      localStorage.setItem('hafedh_finances', JSON.stringify(finances));
      localStorage.setItem('hafedh_prayers', JSON.stringify(prayers));
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById('items-container');
      document.getElementById('archive-link').innerText = `📁 الأرشيف (${archive.length})`;

      container.innerHTML = items.length ? items.map((item, index) => {
        let borderColor = item.priority === 'high' ? 'border-r-red-500' : (item.priority === 'low' ? 'border-r-green-500' : 'border-r-blue-500');
        let dotColor = item.priority === 'high' ? 'bg-red-500' : (item.priority === 'low' ? 'bg-green-500' : 'bg-blue-500');

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200 relative overflow-hidden border-r-8 ${borderColor} flex items-center justify-between">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full ${dotColor}"></span>
                <h3 class="font-bold text-gray-800 text-base">${item.name}</h3>
                <span class="text-xs text-gray-400 font-semibold">${index + 1}</span>
              </div>
              ${item.phone ? `<a href="tel:${item.phone}" class="text-xs text-gray-500 flex items-center gap-1 bg-gray-50 px-2 py-1 rounded-lg w-fit border">📞 ${item.phone}</a>` : ''}
              ${item.notes ? `<p class="text-xs text-gray-400">${item.notes}</p>` : ''}
            </div>
            <div class="flex items-center gap-2">
              ${item.phone ? `<a href="tel:${item.phone}" class="bg-gray-100 p-2 roun

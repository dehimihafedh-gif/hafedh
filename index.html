<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حافظ - منظمي الشخصي</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/calendar--v1.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-24">

  <header class="bg-indigo-600 text-white p-4 text-center sticky top-0 z-50 shadow-md flex items-center justify-center space-x-2 space-x-reverse">
    <span class="text-2xl">📖</span>
    <h1 class="text-xl font-bold">حافظ</h1>
  </header>

  <main class="p-4 max-w-md mx-auto space-y-6">

    <!-- قسم التقويم والمواعيد -->
    <section id="tab-calendar" class="tab-content bg-white p-5 rounded-xl shadow-md space-y-3">
      <h2 class="text-lg font-bold mb-2 text-indigo-600 flex items-center gap-2"><span>📅</span> التقويم والمواعيد</h2>
      <input type="text" id="event-title" placeholder="عنوان الموعد" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <input type="date" id="event-date" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button onclick="addEvent()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">إضافة موعد</button>
      <ul id="events-list" class="mt-4 divide-y"></ul>
    </section>

    <!-- قسم المصاريف -->
    <section id="tab-expenses" class="tab-content hidden bg-white p-5 rounded-xl shadow-md space-y-3">
      <h2 class="text-lg font-bold mb-2 text-green-600 flex items-center gap-2"><span>💰</span> المصاريف</h2>
      <input type="number" id="exp-amount" placeholder="المبلغ (دج)" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
      <input type="text" id="exp-desc" placeholder="الوصف (مثلاً: شراء غرض)" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
      <button onclick="addExpense()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">إضافة مصروف</button>
      <div class="mt-3 p-3 bg-green-50 rounded-lg flex justify-between items-center font-bold text-green-800">
        <span>إجمالي المصاريف:</span>
        <span id="total-exp">0</span> دج
      </div>
      <ul id="expenses-list" class="mt-4 divide-y"></ul>
    </section>

    <!-- قسم الروتين اليومي -->
    <section id="tab-habits" class="tab-content hidden bg-white p-5 rounded-xl shadow-md space-y-3">
      <h2 class="text-lg font-bold mb-2 text-amber-600 flex items-center gap-2"><span>✅</span> الروتين اليومي</h2>
      <input type="text" id="habit-title" placeholder="اسم العادة أو الروتين" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
      <button onclick="addHabit()" class="w-full bg-amber-600 text-white py-3 rounded-lg font-bold hover:bg-amber-700 transition">إضافة عادة</button>
      <ul id="habits-list" class="mt-4 divide-y"></ul>
    </section>

    <!-- قسم السحاب -->
    <section id="tab-settings" class="tab-content hidden bg-white p-5 rounded-xl shadow-md space-y-3">
      <h2 class="text-lg font-bold mb-2 text-blue-600 flex items-center gap-2"><span>⚙️</span> السحاب والنسخ الاحتياطي</h2>
      <button onclick="handleGoogleLogin()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">تسجيل الدخول بـ Google</button>
      <button onclick="backupData()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition">رفع نسخة احتياطية إلى Drive</button>
      <button onclick="restoreData()" class="w-full bg-gray-600 text-white py-3 rounded-lg font-bold hover:bg-gray-700 transition">استرجاع البيانات من Drive</button>
      <p id="sync-status" class="text-xs text-center text-gray-500 mt-3"></p>
    </section>

  </main>

  <!-- شريط التنقل السفلي -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 text-xs font-bold text-gray-700 shadow-lg z-50">
    <button onclick="switchTab('calendar')" id="btn-calendar" class="flex flex-col items-center text-indigo-600 transition">
      <span class="text-xl mb-1">📅</span>التقويم
    </button><button onclick="switchTab('expenses')" id="btn-expenses" class="flex flex-col items-center text-gray-400 hover:text-gray-700 transition">
      <span class="text-xl mb-1">💰</span>المصاريف
    </button>
    <button onclick="switchTab('habits')" id="btn-habits" class="flex flex-col items-center text-gray-400 hover:text-gray-700 transition">
      <span class="text-xl mb-1">✅</span>الروتين
    </button>
    <button onclick="switchTab('settings')" id="btn-settings" class="flex flex-col items-center text-gray-400 hover:text-gray-700 transition">
      <span class="text-xl mb-1">⚙️</span>السحاب
    </button>
  </nav>

  <script>
    const CLIENT_ID = '358736924266-9vhit2t5filvuchg2h3u19pmb95brn59.apps.googleusercontent.com';

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      ['calendar', 'expenses', 'habits', 'settings'].forEach(t => {
        const btn = document.getElementById(`btn-${t}`);
        if(btn) {
          btn.className = "flex flex-col items-center text-gray-400 hover:text-gray-700 transition";
        }
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`btn-${tabName}`);
      if (activeBtn) {
        const colors = { calendar: 'text-indigo-600', expenses: 'text-green-600', habits: 'text-amber-600', settings: 'text-blue-600' };
        activeBtn.className = `flex flex-col items-center ${colors[tabName]} transition`;
      }
    }

    let events = JSON.parse(localStorage.getItem('my_events')) || [];
    let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];
    let habits = JSON.parse(localStorage.getItem('my_habits')) || [];

    function renderAll() {
      const evlist = document.getElementById('events-list');
      if (evlist) {
        evlist.innerHTML = events.length ? events.map((e, index) => `<li class="py-3 flex justify-between items-center"><div><span class="font-bold block">${e.title}</span><span class="text-xs text-gray-500">${e.date}</span></div><button onclick="deleteEvent(${index})" class="text-red-500 text-xs px-2 py-1 border border-red-200 rounded">حذف</button></li>`).join('') : '<p class="text-gray-400 text-center py-2 text-xs">لا توجد مواعيد مضافة</p>';
      }

      const exlist = document.getElementById('expenses-list');
      if (exlist) {
        exlist.innerHTML = expenses.length ? expenses.map((ex, index) => `<li class="py-3 flex justify-between items-center"><div><span class="block">${ex.desc}</span><span class="font-bold text-green-600">${ex.amount} دج</span></div><button onclick="deleteExpense(${index})" class="text-red-500 text-xs px-2 py-1 border border-red-200 rounded">حذف</button></li>`).join('') : '<p class="text-gray-400 text-center py-2 text-xs">لا توجد مصاريف مسجلة</p>';
        const total = expenses.reduce((sum, item) => sum + Number(item.amount), 0);
        document.getElementById('total-exp').innerText = total;
      }

      const hbList = document.getElementById('habits-list');
      if (hbList) {
        hbList.innerHTML = habits.length ? habits.map((h, index) => `<li class="py-3 flex justify-between items-center"><span class="font-medium">${h.title}</span><button onclick="deleteHabit(${index})" class="text-red-500 text-xs px-2 py-1 border border-red-200 rounded">حذف</button></li>`).join('') : '<p class="text-gray-400 text-center py-2 text-xs">لا توجد عادات مسجلة</p>';
      }
    }

    function addEvent() {
      const title = document.getElementById('event-title').value;
      const date = document.getElementById('event-date').value;
      if (title && date) {
        events.push({ title, date });
        localStorage.setItem('my_events', JSON.stringify(events));
        renderAll();
        document.getElementById('event-title').value = '';
        document.getElementById('event-date').value = '';
      }
    }

    function addExpense() {
      const amount = document.getElementById('exp-amount').value;
      const desc = document.getElementById('exp-desc').value;
      if (amount && desc) {
        expenses.push({ amount, desc });
        localStorage.setItem('my_expenses', JSON.stringify(expenses));
        renderAll();
        document.getElementById('exp-amount').value = '';
        document.getElementById('exp-desc').value = '';
      }
    }

    function addHabit() {
      const title = document.getElementById('habit-title').value;
      if (title) {
        habits.push({ title });
        localStorage.setItem('my_habits', JSON.stringify(habits));
        renderAll();
        document.getElementById('habit-title').value = '';
      }
    }

    function deleteEvent(i) { events.splice(i, 1); localStorage.setItem('my_events', JSON.stringify(events)); renderAll(); }
    function deleteExpense(i) { expenses.splice(i, 1); localStorage.setItem('my_expenses', JSON.stringify(expenses)); renderAll(); }
    function deleteHabit(i) { habits.splice(i, 1); localStorage.setItem('my_habits', JSON.stringify(habits)); renderAll(); }

    renderAll();

    function handleGoogleLogin() {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (tokenResponse) => {
          if (tokenResponse.access_token) {
            localStorage.setItem('gdrive_token', tokenResponse.access_token);
            document.getElementById('sync-status').innerText = 'تم تسجيل الدخول بنجاح!';
          }
        }
      });
      client.requestAccessToken();
    }

    function backupData() {
      document.getElementById('sync-status').innerText = 'جاري الرفع إلى السحاب...';
    }

    function restoreData() {
      document.getElementById('sync-status').innerText = 'جاري استرجاع البيانات...';
    }
  </script>
</body>
        </html>

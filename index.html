<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حافظ - منظمي الشخصي</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/calendar--v1.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-24">

  <header class="bg-indigo-600 text-white p-4 text-center sticky top-0 z-50 shadow-md flex items-center justify-center space-x-2 space-x-reverse">
    <span class="text-2xl">📖</span>
    <h1 class="text-xl font-bold">حافظ</h1>
  </header>

  <main class="p-4 max-w-md mx-auto space-y-6">

    <section id="tab-calendar" class="tab-content bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-bold mb-3 text-indigo-600">📅 التقويم والمواعيد</h2>
      <input type="text" id="event-title" placeholder="عنوان الموعد" class="w-full p-2 border rounded mb-2">
      <input type="date" id="event-date" class="w-full p-2 border rounded mb-2">
      <button onclick="addEvent()" class="w-full bg-indigo-600 text-white py-2 rounded font-bold">إضافة موعد</button>
      <ul id="events-list" class="mt-4 divide-y"></ul>
    </section>

    <section id="tab-expenses" class="tab-content hidden bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-bold mb-3 text-green-600">💰 المصاريف</h2>
      <input type="number" id="exp-amount" placeholder="المبلغ" class="w-full p-2 border rounded mb-2">
      <input type="text" id="exp-desc" placeholder="الوصف (مثلاً: شراء فرض)" class="w-full p-2 border rounded mb-2">
      <button onclick="addExpense()" class="w-full bg-green-600 text-white py-2 rounded font-bold">إضافة مصروف</button>
      <div class="mt-4 font-bold text-gray-700">المجموع: <span id="total-exp">0</span></div>
      <ul id="expenses-list" class="mt-4 divide-y"></ul>
    </section>

    <section id="tab-habits" class="tab-content hidden bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-bold mb-3 text-amber-600">✅ الروتين اليومي</h2>
      <input type="text" id="habit-title" placeholder="عادة جديدة" class="w-full p-2 border rounded mb-2">
      <button onclick="addHabit()" class="w-full bg-amber-600 text-white py-2 rounded font-bold">إضافة عادة</button>
      <ul id="habits-list" class="mt-4 divide-y"></ul>
    </section>

    <section id="tab-settings" class="tab-content hidden bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-bold mb-3 text-indigo-600">⚙️ السحاب (Google Drive)</h2>
      <button onclick="handleGoogleLogin()" class="w-full bg-blue-600 text-white py-2 rounded font-bold mb-3">تسجيل الدخول بـ Google</button>
      <button onclick="backupData()" class="w-full bg-emerald-600 text-white py-2 rounded font-bold mb-3">رفع نسخة احتياطية إلى Drive</button>
      <button onclick="restoreData()" class="w-full bg-gray-600 text-white py-2 rounded font-bold">استرجاع البيانات من Drive</button>
      <p id="sync-status" class="text-xs text-center text-gray-500 mt-3"></p>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 text-xs font-bold text-gray-700 shadow-lg z-50">
    <button onclick="switchTab('calendar')" id="btn-calendar" class="flex flex-col items-center text-indigo-600">
      <span class="text-xl mb-1">📅</span>التقويم
    </button>
    <button onclick="switchTab('expenses')" id="btn-expenses" class="flex flex-col items-center text-gray-600">
      <span class="text-xl mb-1">💰</span>المصاريف
    </button>
    <button onclick="switchTab('habits')" id="btn-habits" class="flex flex-col items-center text-gray-600">
      <span class="text-xl mb-1">✅</span>الروتين
    </button>
    <button onclick="switchTab('settings')" id="btn-settings" class="flex flex-col items-center text-gray-600">
      <span class="text-xl mb-1">⚙️</span>السحاب
    </button>
  </nav>

  <script>
    const CLIENT_ID = '358736924266-9vhit2t5filvuchg2h3u19pmb95brn59.apps.googleusercontent.com';

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('nav button').forEach(el => {
        el.classList.remove('text-indigo-600');
        el.classList.add('text-gray-650', 'text-gray-600');
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`btn-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-600');
        activeBtn.classList.add('text-indigo-600');
      }
    }

    let events = JSON.parse(localStorage.getItem('my_events')) || [];
    let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];
    let habits = JSON.parse(localStorage.getItem('my_habits')) || [];

    function renderAll() {
      const evlist = document.getElementById('events-list');
      if (evlist) evlist.innerHTML = events.map(e => `<li class="py-2 flex justify-between"><span>${e.title}</span><span class="text-gray-500">${e.date}</span></li>`).join('');

      const exlist = document.getElementById('expenses-list');
      if (exlist) {
        exlist.innerHTML = expenses.map(ex => `<li class="py-2 flex justify-between"><span>${ex.desc}</span><span class="font-bold">${ex.amount} دج</span></li>`).join('');
        const total = expenses.reduce((sum, item) => sum + Number(item.amount), 0);
        document.getElementById('total-exp').innerText = total;
      }

      const hbList = document.getElementById('habits-list');
      if (hbList) hbList.innerHTML = habits.map(h => `<li class="py-2 flex justify-between"><span>${h.title}</span><span class="text-green-600">✓</span></li>`).join('');
    }

    function addEvent() {
      const title = document.getElementById('event-title').value;
      const date = document.getElementById('event-date').value;
      if (title && date) {
        events.push({ title, date });
        localStorage.setItem('my_events', JSON.stringify(events));
        renderAll();
        document.getElementById('event-title').value = '';
        document.getElementById('event-date').value = '';
      }
    }

    function addExpense() {
      const amount = document.getElementById('exp-amount').value;
      const desc = document.getElementById('exp-desc').value;
      if (amount && desc) {
        expenses.push({ amount, desc });
        localStorage.setItem('my_expenses', JSON.stringify(expenses));
        renderAll();
        document.getElementById('exp-amount').value = '';
        document.getElementById('exp-desc').value = '';
      }
    }

    function addHabit() {
      const title = document.getElementById('habit-title').value;
      if (title) {
        habits.push({ title });
        localStorage.setItem('my_habits', JSON.stringify(habits));
        renderAll();
        document.getElementById('habit-title').value = '';
      }
    }

    renderAll();

    function handleGoogleLogin() {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (tokenResponse) => {
          if (tokenResponse.access_token) {
            localStorage.setItem('gdrive_token', tokenResponse.access_token);
            document.getElementById('sync-status').innerText = 'تم تسجيل الدخول بنجاح!';
          }
        }
      });
      client.requestAccessToken();
    }

    function backupData() {
      document.getElementById('sync-status').innerText = 'جاري الرفع إلى السحاب...';
    }

    function restoreData() {
      document.getElementById('sync-status').innerText = 'جاري استرجاع البيانات...';
    }
  </script>
</body>
      </html>

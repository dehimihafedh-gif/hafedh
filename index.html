<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حافظ - المنظم الشخصي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="pb-28">
    <div class="max-w-md mx-auto p-4">
        <!-- رأس التطبيق -->
        <header class="bg-indigo-600 text-white p-4 rounded-2xl shadow-md mb-6 text-center">
            <h1 class="text-2xl font-bold">تطبيق حافظ</h1>
            <p class="text-sm text-indigo-100 mt-1">منظمك الشخصي اليومي</p>
        </header>

        <!-- المحتوى الرئيسي -->
        <main class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="font-bold text-slate-800 mb-2">مهام اليوم</h2>
                <p class="text-slate-500 text-sm">أضف مهامك وتابع إنجازاتك اليومية بكل سهولة.</p>
            </div>
            
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="font-bold text-slate-800 mb-2">تتبع الصلوات</h2>
                <p class="text-slate-500 text-sm">حافظ على الصلوات في أوقاتها المحددة.</p>
            </div>
        </main>
    </div>
</body>
</html>
